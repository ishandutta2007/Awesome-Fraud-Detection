<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
    🛡️ Awesome Fraud Detection
  </text>
  <text x="50%" y="75%" font-family="Arial, sans-serif" font-size="20" fill="#e0e0e0" text-anchor="middle" dominant-baseline="middle">
    Curated SaaS &amp; Open-Source Tools
  </text>
  <circle cx="10%" cy="50%" r="5" fill="white">
    <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="90%" cy="50%" r="5" fill="white">
    <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>